<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon / Instagram avatar · sunset gradient with golden glow -->
  <defs>
    <radialGradient id="sun-bg" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f4a45c"/>
      <stop offset="40%" stop-color="#c0532a"/>
      <stop offset="100%" stop-color="#2a1f15"/>
    </radialGradient>
    <radialGradient id="sun-glow" cx="50%" cy="120%" r="50%">
      <stop offset="0%" stop-color="#fde0a8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fde0a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square base -->
  <rect width="200" height="200" rx="44" fill="url(#sun-bg)"/>

  <!-- Sun glow at the bottom -->
  <rect width="200" height="200" rx="44" fill="url(#sun-glow)"/>

  <!-- Mark -->
  <circle cx="100" cy="100" r="52" fill="none" stroke="#f3ebd9" stroke-width="10" stroke-linecap="round"/>
  <circle cx="126" cy="55" r="15" fill="#f3ebd9"/>
  <circle cx="74" cy="55" r="15" fill="#f3ebd9"/>
</svg>
